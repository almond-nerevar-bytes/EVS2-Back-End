{% extends 'base.html' %}
{% load static %}

{% block title %}{{ tema.nombre }}{% endblock %}

{% block content %}
    <div class="mb-4">
        <a href="{% url 'inicio:index' %}" class="btn btn-secondary btn-sm mb-3">&larr; Volver a Temas</a>
        <h2>{{ tema.nombre }}</h2>
        <p class="text-muted">{{ tema.descripcion }}</p>
    </div>

    <div id="carruselTema" class="carousel slide shadow rounded overflow-hidden" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="{% static tema.imagenes.0.archivo %}" class="d-block w-100" alt="Foto 1" style="height: 480px; object-fit: cover;">
                <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50 rounded p-2">
                    <h5>{{ tema.imagenes.0.titulo }}</h5>
                </div>
            </div>
            <div class="carousel-item">
                <img src="{% static tema.imagenes.1.archivo %}" class="d-block w-100" alt="Foto 2" style="height: 480px; object-fit: cover;">
                <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50 rounded p-2">
                    <h5>{{ tema.imagenes.1.titulo }}</h5>
                </div>
            </div>
        </div>

        <button class="carousel-control-prev" type="button" data-bs-target="#carruselTema" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carruselTema" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
    </div>
{% endblock %}
